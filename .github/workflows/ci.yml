# =============================================================================
# CI — Runs on every push and PR to any branch
# Checks: typecheck → lint → build
# A failing build here will block the PR from being merged.
# =============================================================================

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── Typecheck ──────────────────────────────────────────────────────────
      - name: Typecheck
        run: npm run typecheck

      # ── Lint ───────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── Build ──────────────────────────────────────────────────────────────
      # NEXT_PUBLIC_* vars are baked at build time — provide CI stubs so the
      # build doesn't error on missing env. Server-side secrets are runtime-only
      # and are not needed here.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://ci-stub.addispulse.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
          # Server-side stubs (needed to satisfy module imports at build time)
          SUPABASE_SERVICE_ROLE_KEY: ci-stub
          SUPABASE_JWT_SECRET: ci-stub
          RESEND_API_KEY: ci-stub
          AT_API_KEY: ci-stub
          AT_USERNAME: sandbox
          AT_SENDER_ID: AddisPulse
          TELEGRAM_OPS_BOT_TOKEN: ci-stub
          TELEGRAM_DRIVER_BOT_TOKEN: ci-stub
          DEFAULT_OPS_TELEGRAM_CHAT_ID: '0'
          IP_HASH_SECRET: ci-stub-32-char-secret-placeholder
          DEVICE_FP_HASH_SECRET: ci-stub-32-char-secret-placeholder
          OTP_SECRET: ci-stub-32-char-secret-placeholder
          RATE_LIMIT_SECRET: ci-stub-32-char-secret-placeholder
          OTP_EXPIRY_MINUTES: '10'
          OTP_MAX_ATTEMPTS: '3'
          CSV_EXPORT_MAX_ROWS: '50000'
          FRAUD_VELOCITY_THRESHOLD: '3'
